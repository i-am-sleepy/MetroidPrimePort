name: android-apk
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches
        run: |
          python3 touchlook_patch.py
          python3 driver_patch.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: SDK, NDK, CMake
        run: |
          NDKV=$(grep -oP 'ndkVersion "\K[^"]+' android/app/build.gradle)
          CMV=$(grep -oP '^\s*version "\K[0-9.]+(?=")' android/app/build.gradle | head -1)
          SDKV=$(grep -oP 'compileSdk \K[0-9]+' android/app/build.gradle | head -1)
          echo "NDK=$NDKV CMake=$CMV SDK=$SDKV"
          echo "NDKV=$NDKV" >> "$GITHUB_ENV"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(find "$ANDROID_HOME" /usr/local/lib/android -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-$SDKV" "build-tools;34.0.0" "ndk;$NDKV" "cmake;$CMV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Restore release key cache
        uses: actions/cache@v4
        with:
          path: ~/mp-key
          key: mp-release-key-v1
      - name: Release key
        run: |
          mkdir -p ~/mp-key
          if [ ! -f ~/mp-key/release.jks ]; then
            keytool -genkeypair -keystore ~/mp-key/release.jks -storepass mpsideload \
              -keypass mpsideload -alias mp -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=MP Port Sideload"
          fi
          {
            echo "MP_APK_KEYSTORE=$HOME/mp-key/release.jks"
            echo "MP_APK_KEYSTORE_PASSWORD=mpsideload"
            echo "MP_APK_KEY_ALIAS=mp"
            echo "MP_APK_KEY_PASSWORD=mpsideload"
          } >> "$GITHUB_ENV"
      - name: Build
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDKV"
          chmod +x tools/*.sh
          tools/android_apk.sh :app:assembleRelease
      - name: List native libs in the APK
        run: unzip -l android/app/build/outputs/apk/release/*.apk | grep -E "lib/arm64" || true
      - uses: actions/upload-artifact@v4
        with:
          name: metroid-prime-touchlook-apk
          path: android/app/build/outputs/apk/release/*.apk
